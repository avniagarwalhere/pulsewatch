services:
  # 1. FastAPI Python Backend Web Service
  - type: web
    name: pulsewatch-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: pulsewatch-db
          property: connectionString

  # 2. React Vite Frontend Static Site
  - type: web
    name: pulsewatch-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # 3. Managed PostgreSQL Database
  - name: pulsewatch-db
    region: oregon
    plan: free
    databaseName: pulsewatch
    user: pulsewatch
